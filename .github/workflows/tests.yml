name: DeepDrishti tests

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: deepdrishti_solar_twin_mvp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: deepdrishti_solar_twin_mvp/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m py_compile app/*.py
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check app/static/app.js
